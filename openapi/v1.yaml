openapi: 3.1.0
info:
  title: Payment Platform Partner API
  description: Versioned server-to-server contract for partner integrations. Responses use a JSON envelope with data and meta.request_id; errors use error.type, error.code, error.message, error.details and meta.request_id. X-Request-Id matches meta.request_id on every response. Partner credentials are limited to 120 requests per minute by default; HTTP 429 includes Retry-After. Payment acceptance is asynchronous and does not prove settlement. Webhook endpoint and delivery operations are included. Only partner routes are included.
  license:
    name: ''
  version: 1.3.1
paths:
  /v1/customers:
    get:
      tags:
      - Customers
      summary: List customers
      description: Returns up to 100 customers belonging to the authenticated tenant.
      operationId: listCustomersV1
      responses:
        '200':
          description: Customer list
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; matches meta.request_id in the JSON response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
        '401':
          description: Missing, invalid, expired or revoked API key
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; matches meta.request_id in the JSON response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: API key lacks the required scope
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; matches meta.request_id in the JSON response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Partner credential rate limit exceeded; retry after the seconds in Retry-After.
          headers:
            Retry-After:
              schema:
                type: string
              description: Seconds to wait before retrying.
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; matches meta.request_id in the JSON response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        4XX:
          description: Partner request or authorization error.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; matches meta.request_id in the JSON response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal service error
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; matches meta.request_id in the JSON response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        5XX:
          description: Partner API or persistence service error.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; matches meta.request_id in the JSON response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - EdPayPrivateKey: []
        EdPayPublicKey: []
    post:
      tags:
      - Customers
      summary: Create a customer
      description: Creates a customer in the authenticated tenant and environment. Replays with the same idempotency key return the same resource ID and its current representation.
      operationId: createCustomerV1
      parameters:
      - name: Idempotency-Key
        in: header
        description: Unique request key; replaying the same key and body does not create another customer.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCustomer'
        required: true
      responses:
        '201':
          description: Customer created
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; matches meta.request_id in the JSON response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          description: Invalid input
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; matches meta.request_id in the JSON response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing, invalid, expired or revoked API key
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; matches meta.request_id in the JSON response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: API key lacks the required scope
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; matches meta.request_id in the JSON response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Idempotency key conflicts with another request
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; matches meta.request_id in the JSON response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Partner credential rate limit exceeded; retry after the seconds in Retry-After.
          headers:
            Retry-After:
              schema:
                type: string
              description: Seconds to wait before retrying.
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; matches meta.request_id in the JSON response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        4XX:
          description: Partner request or authorization error.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; matches meta.request_id in the JSON response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal service error
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; matches meta.request_id in the JSON response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        5XX:
          description: Partner API or persistence service error.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; matches meta.request_id in the JSON response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - EdPayPrivateKey: []
        EdPayPublicKey: []
