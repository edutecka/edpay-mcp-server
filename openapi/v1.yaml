      - events
      - status
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
        events:
          type: array
          items:
            type: string
        id:
          type: string
        status:
          type: string
        updated_at:
          type: string
        url:
          type: string
    WebhookEndpointView:
      type: object
      required:
      - id
      - url
      - events
      - status
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
        events:
          type: array
          items:
            type: string
        id:
          type: string
        secret:
          type:
          - string
          - 'null'
        status:
          type: string
        updated_at:
          type: string
        url:
          type: string
  securitySchemes:
    EdPayPrivateKey:
      type: apiKey
      in: header
      name: X-EDPay-Private-Key
      description: Private API key. Its sk_test_ or sk_live_ prefix must match the public key and selects the request mode. Send only from a partner server over HTTPS.
    EdPayPublicKey:
      type: apiKey
      in: header
      name: X-EDPay-Public-Key
      description: Public key identifier. Its pk_test_ or pk_live_ prefix selects the request mode; send it with the matching private key.
security:
- EdPayPrivateKey: []
  EdPayPublicKey: []
tags:
- name: Customers
  description: Tenant-scoped customer records.
- name: Invoices
  description: Create one-time invoices and recurring invoice series. Recurrence creates invoices and checkout links; it does not charge automatically. Requires the invoices:read or invoices:write credential scope.
- name: Payment Methods
  description: Public list of payment methods, their availability, and published MZN tariffs.
- name: Payments
  description: Asynchronous, environment-scoped payment intents and event history.
- name: FX
  description: Indicative MZN, USD, EUR and ZAR quotes; no funds are moved.
- name: Webhooks
  description: Register HTTPS endpoints for asynchronous payment events.
- name: Wallets
  description: Read-only wallet balances and posted ledger entries.
