          $ref: '#/components/schemas/WebhookDeliveryView'
    WebhookDeliveryListResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDeliveryView'
