  /v1/fx/quote:
    get:
      tags:
      - FX
      summary: Get an indicative MZN/USD/EUR/ZAR conversion quote
      description: Returns a read-only quote from the active configured rate set. Foreign-to-MZN uses the buy rate; MZN-to-foreign uses the sell rate. The quote does not move funds and expires with the rate set.
      operationId: getFxQuoteV1
      parameters:
      - name: from_currency
        in: query
        required: true
        schema:
          type: string
        example: USD
      - name: to_currency
        in: query
        required: true
        schema:
          type: string
        example: MZN
      - name: amount_minor
        in: query
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
        example: 10000
      responses:
        '200':
          description: Indicative conversion quote
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; matches meta.request_id in the JSON response.
          content:
            application/json:
              schema: {}
        '401':
          description: Missing, invalid, expired or revoked partner API credentials.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; matches meta.request_id in the JSON response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Credential lacks fx:read
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; matches meta.request_id in the JSON response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
