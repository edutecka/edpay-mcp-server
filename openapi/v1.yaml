          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - EdPayPrivateKey: []
        EdPayPublicKey: []
    patch:
      tags:
      - Customers
      summary: Update a customer
      description: Updates the supplied customer fields in the authenticated tenant and API-key environment. Set email to an empty string to clear it. Requires an Idempotency-Key.
      operationId: updateCustomerV1
      parameters:
      - name: id
        in: path
        description: Customer ID
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        description: Stable key for safe retries; same key with a different request returns 409.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomer'
        required: true
      responses:
        '200':
          description: Customer updated
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; matches meta.request_id in the JSON response.
          content:
            application/json:
