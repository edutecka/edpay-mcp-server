          $ref: '#/components/schemas/ResponseMeta'
    WebhookDeliveryResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/WebhookDeliveryDetailView'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    WebhookDeliverySummaryResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/WebhookDeliveryView'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    WebhookDeliveryView:
      type: object
      required:
      - id
      - event_id
      - event_type
      - status
      - attempt_count
      - created_at
      properties:
        attempt_count:
          type: integer
          format: int32
        created_at:
          type: string
        delivered_at:
          type:
          - string
          - 'null'
        event_id:
          type: string
        event_type:
          type: string
        id:
          type: string
        last_error_code:
          type:
          - string
          - 'null'
        last_http_status:
          type:
          - integer
          - 'null'
          format: int32
        status:
          type: string
    WebhookEndpointAuth:
      oneOf:
      - type: object
        required:
        - token
        - type
        properties:
          token:
            type: string
          type:
            type: string
            enum:
            - bearer
      - type: object
        required:
        - name
        - value
        - type
        properties:
          name:
            type: string
          type:
            type: string
            enum:
            - header
          value:
            type: string
      description: |-
        Optional authentication sent by EDPay to a partner's webhook receiver.
        This is unrelated to authentication of inbound partner API requests.
    WebhookEndpointListResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpointSummaryView'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    WebhookEndpointResponse:
      type: object
      required:
      - data
      - meta
      properties:
